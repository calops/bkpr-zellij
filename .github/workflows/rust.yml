name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Exact commit SHA to verify using this trusted workflow'
        required: false
        type: string

# Build/test jobs may execute upstream code. Never give them write access or
# persisted checkout credentials. Only the isolated reporter can write statuses.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build
        run: cargo xtask build

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build
        run: cargo xtask build

  test:
    name: Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test
        run: cargo xtask test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test zellij-utils
        run: cargo test --no-default-features -p zellij-utils --lib

      - name: Test zellij-server
        run: cargo test --no-default-features -p zellij-server --lib

      - name: Test zellij-client
        run: cargo test --no-default-features -p zellij-client --lib

  integration-test:
    name: Integration Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run whole-app integration tests
        run: cargo xtask integration-test

  test-no-web:
    name: Test (No Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test without web support
        run: cargo xtask test --no-web

  assets:
    name: Check Bundled Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test xtask
        run: cargo test -p xtask

      - name: Check bundled assets
        run: cargo xtask assets --check

  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check Format
        run: cargo xtask format --check

  verification-status:
    name: Publish Rust verification status
    needs: [build, build-windows, test, test-windows, integration-test, test-no-web, assets, format]
    # Fork PRs cannot write statuses; a maintainer must dispatch trusted main
    # with the reviewed full head SHA instead. Never use pull_request_target.
    if: >-
      always() &&
      github.repository == 'calops/bkpr-zellij' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # No checkout, artifacts, caches, or upstream scripts in this privileged job.
      - name: Report on the exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
          JOB_RESULTS: ${{ join(needs.*.result, ',') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "checkout_ref must be a full commit SHA" >&2
            exit 1
          fi
          state=failure
          if [[ "$JOB_RESULTS" == "success,success,success,success,success,success,success,success" ]]; then
            state=success
          fi
          gh api --method POST "repos/calops/bkpr-zellij/statuses/$CHECKOUT_SHA" \
            -f state="$state" \
            -f context="Rust release verification" \
            -f description="Rust jobs: $state; human validation still required" \
            -f target_url="$RUN_URL"
