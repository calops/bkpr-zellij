name: Bkpr native runtime

on:
  push:
    branches: [bkpr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkpr-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: bkpr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      # The package runs the native regression checks; don't run them twice.
      - name: Build runtime for ${{ matrix.system }}
        run: nix build --accept-flake-config --no-link .#packages.${{ matrix.system }}.zellij
